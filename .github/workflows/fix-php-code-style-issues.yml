name: Check & fix styling

# Runs on pull requests rather than on every push to any branch.
#
# Pushing a fix straight to a branch used the default GITHUB_TOKEN, and commits
# made with that token do not trigger other workflows — so the Tests workflow
# never ran on the resulting "Fix styling" commit, and a risky-rule rewrite
# could land on main with no test or PHPStan run behind it. On a pull request
# the fix is committed to the PR branch, where the pull_request event still
# reports and the change is reviewed before it merges.
#
# The fixer runs from Composer's own vendor/ rather than a third-party Docker
# image: the exact version is then whatever composer.json resolves — the same
# one a contributor's `composer format` uses — and there is no image tag left
# to pin or drift. (An image TAG is mutable; only a digest would have been a
# real pin, and this needs neither.)
on:
  pull_request:
    paths:
      - '**.php'
      - '.php-cs-fixer.dist.php'

permissions:
  contents: write

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHP CS Fixer
        run: composer format

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Fix styling
