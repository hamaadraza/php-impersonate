name: Tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - 'bin/**'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - 'bin/**'

jobs:
  # ===========================================
  # Lint on the lowest supported PHP versions
  # The test tooling (Pest 3) needs PHP 8.2+, but the library itself claims
  # "php": "^8". This syntax-checks the shipped code on 8.0/8.1 so that claim
  # stays honest without pulling in the newer-PHP dev dependencies.
  # ===========================================
  lint-lowest-php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']

    name: Lint (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax-check shipped PHP files
        run: |
          fail=0
          files="$(find src scripts/lib -name '*.php'; echo bin/php-impersonate-install)"
          for f in $files; do
            php -l "$f" > /dev/null || fail=1
          done
          exit $fail

  # ===========================================
  # Static analysis (PHPStan)
  # ===========================================
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Static analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse

  # ===========================================
  # Native OS Testing (x86_64 and ARM64)
  # ===========================================
  test-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (Pest 3.0 requires PHP 8.2+)
          - os: ubuntu-latest
            php: '8.2'
            name: 'Linux x86_64 (PHP 8.2)'
          - os: ubuntu-latest
            php: '8.3'
            name: 'Linux x86_64 (PHP 8.3)'
          - os: ubuntu-latest
            php: '8.4'
            name: 'Linux x86_64 (PHP 8.4)'
            
          # Windows x86_64
          - os: windows-latest
            php: '8.3'
            name: 'Windows x86_64 (PHP 8.3)'
            
          # macOS Apple Silicon (ARM64) - Primary macOS target
          - os: macos-latest
            php: '8.3'
            name: 'macOS ARM64 Apple Silicon (PHP 8.3)'

    name: ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, soap, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      # The package bundles binaries for mainstream x86_64 platforms only; this
      # fetches the matching binary + library for others (e.g. macOS ARM64) and
      # is a no-op where they are already bundled.
      - name: Install platform curl-impersonate binaries
        run: php bin/php-impersonate-install

      - name: List Installed Dependencies
        run: composer show -D

      - name: Debug - Show platform info
        shell: bash
        run: |
          php -r 'echo "OS: " . PHP_OS . PHP_EOL . "Arch: " . php_uname("m") . PHP_EOL;'

      # Run httpbin locally so the HTTP behaviour tests don't depend on flaky
      # public services. Linux runners have Docker; on Windows/macOS the tests
      # fall back to the public service and skip gracefully if it is unreachable.
      - name: Start local httpbin (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name httpbin -p 8080:80 kennethreitz/httpbin
          for i in $(seq 1 30); do curl -sf http://localhost:8080/status/200 >/dev/null && break || sleep 1; done
          echo "HTTPBIN_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Execute tests
        run: vendor/bin/pest --ci

  # ===========================================
  # Docker Testing for Linux ARM64 & Alpine
  # Note: QEMU emulation can be slow and may cause intermittent failures
  # ===========================================
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            image: php:8.3-cli
            name: 'Linux ARM64 (glibc)'
          - platform: linux/arm64
            image: php:8.3-cli-alpine
            name: 'Linux ARM64 Alpine (musl)'
          - platform: linux/amd64
            image: php:8.3-cli-alpine
            name: 'Linux x86_64 Alpine (musl)'

    name: Docker - ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run tests in Docker
        run: |
          # Local httpbin on a shared network so the containerised tests reach it
          # by hostname instead of depending on public services.
          docker network create testnet
          docker run -d --name httpbin --network testnet kennethreitz/httpbin
          for i in $(seq 1 30); do docker run --rm --network testnet curlimages/curl -sf http://httpbin:80/status/200 >/dev/null 2>&1 && break || sleep 1; done
          docker run --rm --platform ${{ matrix.platform }} \
            --network testnet \
            -e HTTPBIN_URL=http://httpbin:80 \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ${{ matrix.image }} \
            sh -c '
              set -e
              
              # Install dependencies based on distro
              if command -v apk > /dev/null; then
                apk add --no-cache git unzip curl tar
              else
                apt-get update && apt-get install -y git unzip curl tar libzip-dev
                docker-php-ext-install zip
              fi
              
              # Install composer
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              
              # Install dependencies
              composer install --prefer-dist --no-interaction

              # This platform (ARM64 / musl) is not bundled — fetch its binary + library
              php bin/php-impersonate-install

              # Show platform info
              echo "=== Platform Info ==="
              php -r "
                echo \"OS: \" . PHP_OS . PHP_EOL;
                echo \"Arch: \" . php_uname(\"m\") . PHP_EOL;
                require \"vendor/autoload.php\";
                use Raza\PHPImpersonate\Platform\PlatformDetector;
                echo \"Platform: \" . PlatformDetector::getPlatform() . PHP_EOL;
                echo \"Architecture: \" . PlatformDetector::getArchitecture() . PHP_EOL;
                echo \"Libc: \" . PlatformDetector::getLibcType() . PHP_EOL;
                echo \"Binary Dir: \" . PlatformDetector::getBinaryDir() . PHP_EOL;
              "
              echo "===================="
              
              # Run tests
              vendor/bin/pest --ci
            '

  # ===========================================
  # Dependency Stability Testing
  # ===========================================
  test-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-lowest, prefer-stable]

    name: Stability - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, soap, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Install platform curl-impersonate binaries
        run: php bin/php-impersonate-install

      - name: Start local httpbin
        run: |
          docker run -d --name httpbin -p 8080:80 kennethreitz/httpbin
          for i in $(seq 1 30); do curl -sf http://localhost:8080/status/200 >/dev/null && break || sleep 1; done
          echo "HTTPBIN_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Execute tests
        run: vendor/bin/pest --ci
