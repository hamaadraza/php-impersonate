name: Tests

# The path filter must cover every input the suite actually depends on.
# tests/fixtures/** was missing, so a commit changing ONLY the fingerprint
# baseline — the one file whose changes most need checking, and the suite's only
# record of what goes on the wire — triggered no run at all. docker-compose.yml
# (which `composer test-server-up` uses) and the scripts were missing too.
#
# `push` is restricted to main: with pull_request also enabled, every push to a
# PR branch ran the entire matrix twice, QEMU legs included.
#
# Every action is pinned to a commit SHA (the tag it corresponds to is in the
# comment) so that a moved or compromised tag cannot change what runs here.
# Dependabot keeps the SHAs current.
on:
  push:
    branches: [main]
    paths: &test-paths
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'bin/**'
      - 'tests/fixtures/**'
      - 'scripts/**'
  pull_request:
    paths: *test-paths

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # ===========================================
  # Static analysis (PHPStan) and dependency audit
  # ===========================================
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Static analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse

      # The lockfile is untracked (this is a library), so Dependabot never sees
      # the resolved dev dependencies; audit what actually got installed.
      - name: Audit dependencies
        run: composer audit

  # ===========================================
  # Native OS Testing (x86_64 and ARM64)
  # ===========================================
  test-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (Pest 3.0 requires PHP 8.2+)
          - os: ubuntu-latest
            php: '8.2'
            name: 'Linux x86_64 (PHP 8.2)'
          # The release-guarding leg: an unreachable or rate-limited live
          # service FAILS here instead of skipping, so a green run means the
          # fingerprint suites actually verified something.
          - os: ubuntu-latest
            php: '8.3'
            name: 'Linux x86_64 (PHP 8.3, live services required)'
            require_live: '1'
          - os: ubuntu-latest
            php: '8.4'
            name: 'Linux x86_64 (PHP 8.4)'
          # composer.json allows ^8, so the top of that range must be tested
          # too — 8.5 is what new environments now provision.
          - os: ubuntu-latest
            php: '8.5'
            name: 'Linux x86_64 (PHP 8.5)'

          # Windows x86_64
          - os: windows-latest
            php: '8.3'
            name: 'Windows x86_64 (PHP 8.3)'

          # macOS Apple Silicon (ARM64) - Primary macOS target
          - os: macos-latest
            php: '8.3'
            name: 'macOS ARM64 Apple Silicon (PHP 8.3)'

    name: ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, soap, intl, fileinfo, ffi
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      # The package bundles binaries for mainstream platforms only; this
      # fetches the matching binary + library for others and is a no-op where
      # they are already bundled.
      - name: Install platform curl-impersonate binaries
        run: php bin/php-impersonate-install

      - name: List Installed Dependencies
        run: composer show -D

      - name: Debug - Show platform info
        shell: bash
        run: |
          php -r 'echo "OS: " . PHP_OS . PHP_EOL . "Arch: " . php_uname("m") . PHP_EOL;'

      # Every FFI test skips silently when the engine is unavailable, so a
      # green run said nothing about whether the FFI engine was exercised at
      # all. On the platforms that ship a shared library it must be.
      - name: Assert the FFI engine is usable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          php -r 'require "vendor/autoload.php"; $ok = Raza\PHPImpersonate\PHPImpersonate::ffiAvailable(); echo "FFI engine available: ", var_export($ok, true), PHP_EOL; exit($ok ? 0 : 1);'

      # Run httpbin locally so the HTTP behaviour tests don't depend on flaky
      # public services. Linux runners have Docker; on Windows/macOS the tests
      # fall back to the public service and skip gracefully if it is unreachable.
      - name: Start local httpbin (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name httpbin -p 8080:80 mccutchen/go-httpbin:v2.15.0
          for i in $(seq 1 30); do curl -sf http://localhost:8080/status/200 >/dev/null && break || sleep 1; done
          echo "HTTPBIN_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Execute tests
        env:
          REQUIRE_LIVE_SERVICES: ${{ matrix.require_live || '' }}
        run: vendor/bin/pest --ci

  # ===========================================
  # Docker Testing for Linux ARM64 & Alpine
  # Note: QEMU emulation can be slow and may cause intermittent failures
  # ===========================================
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            image: php:8.3-cli
            name: 'Linux ARM64 (glibc)'
          - platform: linux/arm64
            image: php:8.3-cli-alpine
            name: 'Linux ARM64 Alpine (musl)'
          - platform: linux/amd64
            image: php:8.3-cli-alpine
            name: 'Linux x86_64 Alpine (musl)'

    name: Docker - ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run tests in Docker
        run: |
          # Local httpbin on a shared network so the containerised tests reach it
          # by hostname instead of depending on public services.
          docker network create testnet
          docker run -d --name httpbin --network testnet mccutchen/go-httpbin:v2.15.0
          for i in $(seq 1 30); do docker run --rm --network testnet curlimages/curl -sf http://httpbin:80/status/200 >/dev/null 2>&1 && break || sleep 1; done
          docker run --rm --platform ${{ matrix.platform }} \
            --network testnet \
            -e HTTPBIN_URL=http://httpbin:80 \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ${{ matrix.image }} \
            sh -c '
              set -e

              # Install dependencies based on distro. The official php images
              # do not enable ext-ffi, so build it: without it every FFI test
              # skips and these legs only ever exercised the executable engine.
              if command -v apk > /dev/null; then
                apk add --no-cache git unzip curl tar libffi-dev
                docker-php-ext-install ffi
              else
                apt-get update && apt-get install -y git unzip curl tar libzip-dev libffi-dev
                docker-php-ext-install zip ffi
              fi

              # Install composer, verifying the installer signature first.
              EXPECTED="$(curl -sS https://composer.github.io/installer.sig)"
              curl -sS https://getcomposer.org/installer -o composer-setup.php
              ACTUAL="$(php -r "echo hash_file(\"sha384\", \"composer-setup.php\");")"
              [ "$EXPECTED" = "$ACTUAL" ] || { echo "composer installer signature mismatch"; exit 1; }
              php composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm composer-setup.php

              # Install dependencies
              composer install --prefer-dist --no-interaction

              # This platform (ARM64 / musl) is not bundled — fetch its binary + library
              php bin/php-impersonate-install

              # Show platform info
              echo "=== Platform Info ==="
              php -r "
                echo \"OS: \" . PHP_OS . PHP_EOL;
                echo \"Arch: \" . php_uname(\"m\") . PHP_EOL;
                require \"vendor/autoload.php\";
                use Raza\PHPImpersonate\Platform\PlatformDetector;
                echo \"Platform: \" . PlatformDetector::getPlatform() . PHP_EOL;
                echo \"Architecture: \" . PlatformDetector::getArchitecture() . PHP_EOL;
                echo \"Libc: \" . PlatformDetector::getLibcType() . PHP_EOL;
                echo \"Binary Dir: \" . PlatformDetector::getBinaryDir() . PHP_EOL;
              "
              echo "===================="

              # The FFI engine must be usable here, or these legs test only one engine.
              php -r "require \"vendor/autoload.php\"; \$ok = Raza\PHPImpersonate\PHPImpersonate::ffiAvailable(); echo \"FFI engine available: \", var_export(\$ok, true), PHP_EOL; exit(\$ok ? 0 : 1);"

              # Run tests
              vendor/bin/pest --ci
            '

  # ===========================================
  # Dependency Stability Testing
  # ===========================================
  test-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-lowest, prefer-stable]

    name: Stability - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, soap, intl, fileinfo, ffi
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Install platform curl-impersonate binaries
        run: php bin/php-impersonate-install

      - name: Start local httpbin
        run: |
          docker run -d --name httpbin -p 8080:80 mccutchen/go-httpbin:v2.15.0
          for i in $(seq 1 30); do curl -sf http://localhost:8080/status/200 >/dev/null && break || sleep 1; done
          echo "HTTPBIN_URL=http://localhost:8080" >> "$GITHUB_ENV"

      - name: Execute tests
        run: vendor/bin/pest --ci
